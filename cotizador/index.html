<style>
/* Layout: barra superior fija; editor a la izquierda, hoja A4 en vista previa a la derecha; en móvil se alternan. */
:root{
  --bg:#f1f4f4; --surface:#ffffff; --surface2:#e8eeee; --ink:#14201f; --muted:#5b6c6b; --line:#d3dcdc;
  --accent:#0f7f86; --accent-ink:#ffffff; --danger:#b3261e; --ok:#1b7f4b; --paper-bg:#cfd8d8;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --f-head:'Barlow Condensed','Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1617; --surface:#172122; --surface2:#1f2c2d; --ink:#e6eeee; --muted:#95a8a7; --line:#2b3a3b;
    --accent:#3cc0c7; --accent-ink:#062a2c; --danger:#ff8a80; --ok:#62d49b; --paper-bg:#0b1112; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1617; --surface:#172122; --surface2:#1f2c2d; --ink:#e6eeee; --muted:#95a8a7; --line:#2b3a3b;
  --accent:#3cc0c7; --accent-ink:#062a2c; --danger:#ff8a80; --ok:#62d49b; --paper-bg:#0b1112; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app */
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.bar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
.brand small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.status{font-size:13px;color:var(--muted);min-width:74px;text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.dng{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:none;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,520px) minmax(0,1fr);gap:0}
.left{min-width:0;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 12px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.editor{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 80px 0;display:flex;flex-direction:column;gap:14px}
.right{min-width:0;min-height:0;overflow:auto;background:var(--paper-bg);padding:18px 12px 40px}
.sheet{margin:0 auto;position:relative}
.pages{transform-origin:top left;display:flex;flex-direction:column;gap:22px;position:absolute;left:0;top:0}
.pages .page{box-shadow:0 2px 14px rgba(0,0,0,.28)}

/* editor widgets */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:700 18px var(--f-head);letter-spacing:.06em;text-transform:uppercase}
.card h3{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;color:var(--ink);font-weight:500}
textarea{resize:vertical;line-height:1.35}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.sec-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.sec-head{display:flex;gap:6px;align-items:center;padding:8px;background:var(--surface2);border-bottom:1px solid var(--line)}
.sec-head input{font-weight:700;font-family:var(--f-head);font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.items{display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.item{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:6px;align-items:center}
.item.pr{grid-template-columns:54px minmax(0,1fr) 92px auto}
.item .acts{display:flex}
.ic{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:5px 6px;border-radius:5px;font-size:15px;line-height:1}
.ic:hover{background:var(--surface2);color:var(--ink)}
.ic.dng:hover{color:var(--danger)}
.sec-foot{display:flex;gap:6px;padding:0 8px 10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pill.enviada{color:var(--accent);border-color:var(--accent)}
.pill.aprobada{color:var(--ok);border-color:var(--ok)}
.pill.rechazada{color:var(--danger);border-color:var(--danger)}
.demo{background:var(--surface2);border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.logo-box{display:flex;gap:12px;align-items:center}
.logo-prev{width:110px;height:80px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden;flex:none}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px}
.qrow.cur{border-color:var(--accent)}
.qrow b{font-weight:700}
.qrow .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.qrow .tot{font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted)}

/* ===== hoja de cotización (papel blanco, A4 a 96 dpi) ===== */
.paper{font-family:'Barlow',system-ui,sans-serif;color:#17201f;font-size:13.5px;line-height:1.4}
.page{width:794px;height:1123px;position:relative;background:#ffffff;overflow:hidden;flex:none}
.page .band{position:absolute;left:0;top:0;width:794px}
.page .wm{position:absolute;left:50%;top:54%;width:500px;transform:translate(-50%,-50%);opacity:.07;pointer-events:none}
.page .flow{position:absolute;left:64px;width:666px;overflow:hidden}
.flow,.probe .flow{width:666px}
.probe{position:absolute;left:-10000px;top:0;visibility:hidden;width:666px}
.page .brandhead{position:absolute;left:0;top:50px;width:794px;display:flex;flex-direction:column;align-items:center;gap:6px}
.page .brandhead img{max-height:150px;max-width:320px;object-fit:contain}
.tag{font:500 12.5px 'Barlow',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#4a5857;text-align:center}
.mono{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 34px 'Barlow Condensed',sans-serif;letter-spacing:.04em}
.cname{font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#17201f}
.page .band.bot{top:auto;bottom:0}
.page .pfoot{position:absolute;left:64px;width:666px;bottom:76px}
.page .foot{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:#5e6b6a;border-top:1px solid #dde4e4;padding-top:6px;margin-bottom:6px}
.cogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.dochead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ac);padding-bottom:9px;margin-bottom:14px}
.dochead .k{font:700 30px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);line-height:1}
.dochead .n{font-weight:600;font-size:13px;color:#4a5857;margin-top:4px}
.dochead .d{font-weight:600;text-align:right}
.meta{display:grid;grid-template-columns:86px 1fr;row-gap:3px;column-gap:8px;margin:0}
.meta dt{font:600 11.5px 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6b7776;padding-top:2px}
.meta dd{margin:0;font-weight:700}
.intro{margin:12px 0 0;color:#2a3534;white-space:pre-line}
.uw{display:flow-root}
.u-pad{padding-bottom:12px}
.sec{font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ac);border-bottom:1px solid var(--ac-soft);padding:13px 0 4px;margin:0 0 5px}
.it{display:flex;gap:9px;align-items:baseline;padding:2.5px 0 2.5px 4px}
.it .b{color:var(--ac);width:8px;flex:none;font-weight:700}
.it .q{font-weight:700;min-width:24px;font-variant-numeric:tabular-nums;flex:none}
.it .t{flex:1;font-weight:500;overflow-wrap:anywhere}
.it .pr{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.caps .it .t,.caps .meta dd,.caps .intro{text-transform:uppercase}
.terms{padding-top:14px}
.terms h4{margin:0 0 4px;font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}

.close{padding-top:18px}
.brk{display:grid;grid-template-columns:1fr auto;gap:2px 20px;width:290px;margin:0 0 10px auto;font-size:13px;font-variant-numeric:tabular-nums}

.words{margin:7px 0 0;font-size:12px;color:#4a5857;text-transform:uppercase;letter-spacing:.03em}
.pay{margin-top:14px}
.pay h4{margin:0 0 3px;font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}

.uw.abs{position:absolute;left:0;right:0;bottom:0}
.sign .ln{width:230px;border-top:1px solid #17201f;margin-bottom:5px}
.sign b{font-size:14px}
.sign span{font-size:12.5px;color:#4a5857}

.sign{margin:0;padding-top:30px;display:flex;flex-direction:column;align-items:center}

(function(){
'use strict';
var LS='cotizador.v1';
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var uid=function(){return Math.random().toString(36).slice(2,9)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var $=function(id){return document.getElementById(id)};

/* ---------- números y fechas ---------- */
function num(v){
  var s=String(v==null?'':v).trim();
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(',','.');
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n){
  var neg=n<0; n=Math.abs(n);
  var dec=Math.round(n*100)%100, int=Math.floor(Math.round(n*100)/100);
  var s=String(int).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  if(dec) s+=','+String(dec).padStart(2,'0');
  return (neg?'-':'')+s;
}
function money(n,p){return (p.symbol||'Bs')+' '+fmt(n)}
function fmtDate(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return iso||'';
  return parseInt(m[3],10)+' de '+MONTHS[parseInt(m[2],10)-1]+' de '+m[1];
}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
var T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
var C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function below1000(n,ap){
  var out;
  if(n===100) out='cien';
  else{
    var c=Math.floor(n/100), r=n%100, parts=[];
    if(c) parts.push(C[c]);
    if(r){ if(r<30) parts.push(U[r]); else{ var t=Math.floor(r/10),u=r%10; parts.push(u?T[t]+' y '+U[u]:T[t]); } }
    out=parts.join(' ');
  }
  if(ap){ out=out.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un'); }
  return out;
}
function words(n){
  n=Math.floor(n); if(n===0) return 'cero';
  var mill=Math.floor(n/1e6), mil=Math.floor((n%1e6)/1000), r=n%1000, p=[];
  if(mill) p.push(mill===1?'un millón':below1000(mill,true)+' millones');
  if(mil) p.push(mil===1?'mil':below1000(mil,true)+' mil');
  if(r) p.push(below1000(r,false));
  return p.join(' ');
}
function totalWords(n,p){
  var cents=Math.round((n-Math.floor(n))*100);
  return (words(n)+' '+String(cents).padStart(2,'0')+'/100 '+(p.currencyName||'bolivianos')).replace(/\s+/g,' ');
}

 intro:'Conste por el presente documento privado, que reconocido será elevado a instrumento público. Se conviene en un contrato de prestación de servicios entre los suscribientes con las siguientes cláusulas:',
 clauses:[
  ['PRIMERA','**{{empresa}}**, se compromete a prestar servicios de **{{servicios}}**; a continuación, detallamos los equipos que pondremos a su disposición, según cotización enviada.\n\nFecha: {{fecha}}\n\nLugar: {{lugar}}'],
  ['SEGUNDA','El costo total de los servicios es de **{{total}} ({{totalLetras}})**.'],
  ['TERCERA','A la firma del presente documento, el cliente cancelará **{{anticipo}}** ({{anticipoLetras}}) y el saldo restante en el transcurso del evento **{{saldo}}** ({{saldoLetras}}).'],
  ['CUARTA','El Cliente deberá proporcionar el ambiente y la energía eléctrica requerida por el personal asignado al evento (**TÉRMICO TRIFÁSICO DE 100 AMPERES POR FASE**), así como también la seguridad **FÍSICA** tanto de los equipos como del personal, para el buen desenvolvimiento del trabajo.\n\nUna postergación justificada de fecha por parte del cliente deberá comunicarse con 72 horas de anticipación y en ningún caso se fijará después de los siguientes 30 días, sujeto a la disponibilidad de tiempo y equipos por parte de la empresa.'],
  ['QUINTA','Una vez firmado el contrato, el cliente no podrá desestimar y/o retractarse. Si lo hiciera, perderá el valor del anticipo o del total, por los daños y perjuicios ocasionados. **(Salvo por motivos de fuerza mayor o caso fortuito)**'],
  ['SEXTA','Queda establecido que cualquier daño a los equipos de **{{empresa}}**, por parte de personas particulares en general o terceras personas, sea intencional o no, el cliente se compromete a reparar los equipos previas evaluaciones pertinentes.'],
  ['SÉPTIMA','**{{empresa}}**, representada por el señor **{{representante}}**, con CI {{ci_rep}}, por una parte, y por la otra {{tratamiento}} **{{cliente}}**, con CI {{ci_cliente}}, que se denominará el Cliente, ambas partes declaran su conformidad con cada una de las cláusulas del presente contrato, firmado en la ciudad de {{ciudad}} el {{fecha_firma}}.']

function setStatus(t){var el=$('status'); el.textContent=t; clearTimeout(statusT); if(t) statusT=setTimeout(function(){el.textContent=''},2500)}
/* copia de seguridad en IndexedDB: si el navegador vacía localStorage, los datos se recuperan de aquí */
function idb(fn){
  return new Promise(function(res){
    try{
      var rq=indexedDB.open('cotizador',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('kv')};
      rq.onsuccess=function(){try{fn(rq.result,res)}catch(e){res(null)}};
      rq.onerror=function(){res(null)};
    }catch(e){res(null)}
  });
}
function idbSet(v){return idb(function(db,res){var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,'state'); t.oncomplete=function(){res(true)}; t.onerror=function(){res(null)}})}
function idbGet(){return idb(function(db,res){var r=db.transaction('kv').objectStore('kv').get('state'); r.onsuccess=function(){res(r.result||null)}; r.onerror=function(){res(null)}})}
var askedPersist=false;
function persist(){
  clearTimeout(saveT); saveT=0;
  var json;
  try{ cur().updated=Date.now(); json=JSON.stringify(S); }catch(e){return}
  var ok=false;
  try{ localStorage.setItem(LS,json); ok=true; }catch(e){}
  idbSet(json).then(function(r){ if(ok||r) setStatus('Guardado'); else setStatus('No se pudo guardar en este navegador'); });
  if(!askedPersist){ askedPersist=true; try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){} }
}
window.addEventListener('pagehide',function(){ if(saveT) persist(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'&&saveT) persist(); });
function changed(opts){

}

/* ---------- cálculo ---------- */
function totals(q){
  if(q.priceMode==='manual') return {mode:'manual',total:num(q.manualTotal)};
  var sub=0; q.sections.forEach(function(s){s.items.forEach(function(i){sub+=num(i.price)})});
  var disc=sub*num(q.discount)/100, base=sub-disc, tax=q.ivaOn?base*num(q.iva)/100:0;
  return {mode:'auto',sub:sub,disc:disc,tax:tax,total:base+tax};
}

function hexToRgb(h){var m=/^#?([0-9a-f]{6})$/i.exec(h||''); if(!m) return [42,154,160]; var n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]}
function accentVars(p){var c=hexToRgb(p.accent); return '--ac:rgb('+c.join(',')+');--ac-soft:rgba('+c.join(',')+',.35);'}
function waveSvg(p,h,flip){
  var c=p.accent||'#2a9aa0';
  var d=h>60?'M0 0H794V30C610 50 430 26 240 32C150 35 70 50 0 62Z':'M0 0H794V26C600 36 400 22 220 26C130 28 60 34 0 40Z';
  var hh=h>60?64:44;
  var inner='<path d="'+d+'" fill="'+c+'"/>';
  if(flip) inner='<g transform="translate(0,'+hh+') scale(1,-1)">'+inner+'</g>';
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 '+hh+'" width="794" height="'+hh+'">'+inner+'</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

  if(UI.tab==='receipts'){var r=blankReceipt(); S.receipts[r.id]=r; S.curR=r.id; renderEditor(); changed(); setStatus('Recibo nuevo'); return}
  if(UI.tab==='contracts'){var c=blankContract(); S.contracts[c.id]=c; S.curC=c.id; renderEditor(); changed(); setStatus('Contrato nuevo'); return}
  var q=blankQuote(S); S.quotes[q.id]=q; S.cur=q.id; S.demo=false; UI.tab='quote'; renderEditor(); changed(); setStatus('Cotización nueva')});
function setView(v){UI.view=v; document.body.dataset.view=v; $('vEdit').setAttribute('aria-pressed',v==='edit'); $('vPrev').setAttribute('aria-pressed',v==='preview'); if(v==='preview') setTimeout(fitPreview,0)}
$('vEdit').addEventListener('click',function(){setView('edit')});
$('vPrev').addEventListener('click',function(){setView('preview')});

/* logo: se reduce para que quepa en el navegador */
$('logoIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var m=900, r=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.profile.logo=c.toDataURL('image/png'); S.demo=false; renderEditor(); changed();
    };
    img.onerror=function(){setStatus('No se pudo leer la imagen')};
    img.src=fr.result;
  };
  fr.readAsDataURL(f); e.target.value='';
});

/* ---------- descargas ---------- */
var dl=null;
function getDl(){
  if(dl) return Promise.resolve(dl);
  if(!window.claude||!window.claude.use) return Promise.resolve(null);
  return window.claude.use('downloads').then(function(d){dl=d; return d}).catch(function(){return null});
}
function saveFile(name,data){
  return getDl().then(function(d){
    if(!d){
      try{
        var blob=(data instanceof Blob)?data:new Blob([data],{type:'application/json'});
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href); a.remove()},1500); setStatus('Archivo descargado');
      }catch(e){setStatus('No se pudo descargar el archivo')}
      return;
    }
    return d.save({filename:name,data:data}).then(function(){setStatus('Archivo guardado')}).catch(function(err){
      if(err&&err.code==='declined') return; setStatus('No se pudo guardar el archivo');
    });
  });
}
function doExport(){saveFile('cotizador-respaldo.json',JSON.stringify(S))}
$('importIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result); if(!d.quotes||!d.profile) throw new Error('x');
      S=d; normalize(); S.demo=false; renderEditor(); changed(); setStatus('Respaldo restaurado');
    }catch(err){setStatus('El archivo no es un respaldo válido')}
  };
  fr.readAsText(f); e.target.value='';
});
var pdfBusy=false;
$('bPdf').addEventListener('click',async function(){
  if(pdfBusy) return;
  if(!window.html2canvas||!window.jspdf){setStatus('No se cargó el generador de PDF'); return}
  pdfBusy=true; var btn=$('bPdf'); btn.disabled=true; btn.textContent='Generando…';
  var host=document.createElement('div'); host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;display:flex;flex-direction:column';
  document.body.appendChild(host);
  try{
    var q=cur(), k=kind(); await buildAny(host);
    var wmm=210, hmm=DOC.h/DOC.w*210;
    var doc=new window.jspdf.jsPDF({unit:'mm',format:[wmm,hmm],orientation:hmm>wmm?'portrait':'landscape',compress:true});
    var pgs=host.querySelectorAll('.page');
    for(var i=0;i<pgs.length;i++){
      var cv=await window.html2canvas(pgs[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:DOC.w,height:DOC.h,windowWidth:794});
      if(i) doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',0,0,wmm,hmm);
    }
    var blob=doc.output('blob'), nm=function(t){return String(t||'').replace(/[^\w\-]+/g,'_').slice(0,30)};
    var name;
    if(k==='receipt'){var r=curR(); name='Recibo_'+r.number+'-'+r.year+(r.from?'_'+nm(r.from):'')+'.pdf'}
    else if(k==='contract'){var c=curC(); name='Contrato_'+c.number+'-'+c.year+(c.clientName?'_'+nm(c.clientName):'')+'.pdf'}
    else name=(q.number||'cotizacion').replace(/[^\w\-]+/g,'_')+(q.to?'_'+q.to.replace(/[^\w\-]+/g,'_').slice(0,30):'')+'.pdf';
    await saveFile(name,blob);
  }catch(err){ setStatus('No se pudo generar el PDF'); }
  finally{ document.body.removeChild(host); pdfBusy=false; btn.disabled=false; btn.textContent='Descargar PDF'; }
});
